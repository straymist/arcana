  'new-idea':()=>ideaForm(),idea:b=>ideaForm(b.dataset.id),
  forge:b=>{const idea=findIdea(b.dataset.id);cardForm(null,{type:'idea',id:idea.id},idea.text,idea);},
  'idea-spread':b=>{commit(s=>{const v=activeSession(s);v.ideaId=b.dataset.id;v.question=s.ideas.find(x=>x.id===b.dataset.id).text;event(v,'idea',{ideaId:b.dataset.id});s.ui.activeView='spread';});document.querySelector('#dialog').close();toast('想法已撈起。帶著這個問題來抽牌。');},
  stir:()=>{const ids=(order.length?order:state.ideas.slice().sort((a,b)=>b.priority-a.priority).map(i=>i.id)).filter(id=>findIdea(id));if(ids.length>1){const offset=1+Math.floor(Math.random()*(ids.length-1));order=ids.slice(offset).concat(ids.slice(0,offset));}render();document.querySelector('.vessel').classList.add('stirring');playTone(state.ui.muted);toast('舊念頭重新浮現。浮力沒有改變。');},

"card-icons.js":(exports,require)=>{
const { esc }=require("ui.js");
const ICON_CATEGORIES={
  '自然與環境':['🌊','🌱','🌳','🍄','🌋','🏔️','🌙','☀️','🌧️','❄️','🔥','🪨'],
  '生命與角色':['🧑','👥','👁️','🧠','🦴','🐦','🐟','🦊','🦋','🐚','🥚','🐾'],
  '物件與場所':['🏙️','🏚️','🚪','🪞','🔑','🔔','🕯️','📦','🧵','🧭','⌛','⚖️'],
  '動作與機制':['🔨','⚙️','🧲','✂️','🔗','🛡️','💥','🔄','🔀','⚡','🪜','🎲'],
  '情緒與關係':['❤️','💔','🎭','🤝','💭','❓','❗','👑','🎁','🕊️','🕸️','🫧'],
  '符號與魔法':['✧','✦','◎','⟁','✳','∞','☯','♟','🔮','🪄','📜','🧿']
};
function cardArt(card){return card?.iconImage?`<img class="card-image" src="${esc(card.iconImage)}" alt=""/>`:esc(card?.icon||'✧');}
function iconPicker(card,label='圖示'){
  return `<fieldset class="icon-picker"><legend>${esc(label)}</legend><div class="icon-preview-row"><span id="card-icon-preview" class="icon-preview">${cardArt(card)}</span><p>從分類挑一個圖示，或使用自己的圖片。</p></div><label class="field">圖示分類<select id="icon-category">${Object.keys(ICON_CATEGORIES).map(name=>`<option>${name}</option>`).join('')}</select></label><div id="icon-options" class="icon-options" role="group" aria-label="預設圖示">${iconOptions(Object.keys(ICON_CATEGORIES)[0])}</div><details class="custom-icon"><summary>自行輸入符號</summary><label class="field">文字或 Emoji<input name="icon" maxlength="32" required value="${esc(card?.icon||'✧')}"/></label></details><div class="icon-upload-row"><label class="file-button secondary">上傳圖片<input id="card-icon-file" type="file" accept="image/png,image/jpeg,image/webp"/></label><button type="button" class="text-button" id="remove-card-image" ${card?.iconImage?'':'hidden'}>移除上傳圖片</button></div><p class="microcopy" id="icon-feedback" role="status">支援 PNG、JPG、WebP，最多 5 MB。會縮為小圖並隨 JSON 備份保存。</p></fieldset>`;
}
function iconOptions(category){return (ICON_CATEGORIES[category]||[]).map(value=>`<button type="button" class="icon-option" data-icon="${esc(value)}" aria-label="使用圖示 ${esc(value)}">${value}</button>`).join('');}
async function readIconImage(file){
  if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('請選擇 PNG、JPG 或 WebP 圖片。');
  if(file.size>5*1024*1024)throw Error('圖片超過 5 MB，請選擇較小的圖片。');
  const url=URL.createObjectURL(file),image=new Image();
  try{
    image.src=url;await image.decode();
    if(!image.naturalWidth||!image.naturalHeight||image.naturalWidth*image.naturalHeight>40_000_000)throw Error('圖片尺寸過大，請選擇較小的圖片。');
    const canvas=document.createElement('canvas');canvas.width=128;canvas.height=128;
    const context=canvas.getContext('2d');if(!context)throw Error('此瀏覽器無法處理圖片。');
    const scale=Math.min(128/image.naturalWidth,128/image.naturalHeight),w=image.naturalWidth*scale,h=image.naturalHeight*scale;
    context.drawImage(image,(128-w)/2,(128-h)/2,w,h);
    const result=canvas.toDataURL('image/png');if(result.length>150000)throw Error('圖片轉換後過大，請選擇較簡單的圖示。');return result;
  }catch(error){if(error.message.includes('圖片')||error.message.includes('瀏覽器'))throw error;throw Error('無法讀取這張圖片，請換一張有效圖片。');}
  finally{URL.revokeObjectURL(url);}
}
function bindIconPicker(dialog,card,onImageChange){
  const input=dialog.querySelector('[name=icon]'),preview=dialog.querySelector('#card-icon-preview'),remove=dialog.querySelector('#remove-card-image'),feedback=dialog.querySelector('#icon-feedback'),fileInput=dialog.querySelector('#card-icon-file');
  let image=card?.iconImage||null,version=0;
  const refresh=()=>{preview.innerHTML=cardArt({icon:input.value,iconImage:image});remove.hidden=!image;dialog.querySelectorAll('.icon-option').forEach(button=>button.setAttribute('aria-pressed',String(!image&&button.dataset.icon===input.value)));onImageChange(image);};
  const useSymbol=()=>{version++;image=null;fileInput.value='';feedback.textContent='已選用圖示，保存後套用。';refresh();};
  dialog.querySelector('#icon-category').onchange=e=>{dialog.querySelector('#icon-options').innerHTML=iconOptions(e.target.value);refresh();};
  dialog.querySelector('#icon-options').onclick=e=>{const option=e.target.closest('[data-icon]');if(option){input.value=option.dataset.icon;useSymbol();}};
  input.addEventListener('input',useSymbol);remove.onclick=useSymbol;
  fileInput.onchange=async()=>{
    const file=fileInput.files[0];if(!file)return;const request=++version,submit=dialog.querySelector('[type=submit]');submit.disabled=true;feedback.textContent='正在縮小圖片…';
    try{const result=await readIconImage(file);if(request!==version||!dialog.open)return;image=result;refresh();feedback.textContent='圖片已準備好，保存後套用。';}
    catch(error){if(request===version){feedback.textContent=error.message;fileInput.value='';}}
    finally{if(request===version||!fileInput.value)submit.disabled=false;}
  };
  dialog.querySelector('#icon-category').value=Object.keys(ICON_CATEGORIES).find(category=>ICON_CATEGORIES[category].includes(input.value))||Object.keys(ICON_CATEGORIES)[0];
  dialog.querySelector('#icon-options').innerHTML=iconOptions(dialog.querySelector('#icon-category').value);
  refresh();
}

Object.assign(exports,{ICON_CATEGORIES,cardArt,iconPicker,iconOptions,readIconImage,bindIconPicker});
},
"cauldron.js":(exports,require)=>{
const { cardArt }=require("card-icons.js");
const { RECORD_KINDS }=require("data.js");
const { esc, icon, button, date }=require("ui.js");
function cauldronView(state,order=[],query=''){
  const sorted=[...state.ideas].sort((a,b)=>b.priority-a.priority),ideas=order.length?order.map(id=>sorted.find(i=>i.id===id)).filter(Boolean):sorted;

const { ROLES, DIRECTIONS, DEPTH_SHIFTS, activeSession }=require("data.js");
function buildGamePrompt(state){
  const session=activeSession(state);
  if(!session||!Object.keys(ROLES).every(slot=>session.snapshot[slot]&&(!session.directionsRevealed||session.directions[slot])))throw Error('先抽出完整的六張牌，再複製解牌提示。');
  const lines=[
    '你是一位遊戲設計師。請根據以下 GOM 素材與各欄方向，提出 3 個可製作小型原型的遊戲提案。',
    '素材可以被重新詮釋；方向牌是各欄的思考方式。每項 AI 提案都只是候選，由創作者決定是否採用。',
    '',
    session.question?'本次問題：'+session.question:'本次問題：留白，請自由探索。',
    '',
    '【本次牌陣】'
  ];
  for(const [slot,role] of Object.entries(ROLES)){
    const card=session.snapshot[slot],direction=DIRECTIONS[session.directions[slot]];
    lines.push(`${slot}｜${role.name}（${role.question}）：${card.icon} ${card.text}`);
    if(!session.directionsRevealed){lines.push('  方向牌蓋起：僅使用本欄素材，不施加方向變換。','');continue;}
    lines.push(`  ${slot} 的方向：${direction.name}。${direction.detail}`);
    if(session.directions[slot]==='lateral')lines.push(`  ${slot} 的晶球詞：${session.randomWords[slot]||'尚未抽詞'}。請嘗試跨領域的關係碰撞。`);
    if(session.directions[slot]==='depth'){const shift=DEPTH_SHIFTS[session.depthShifts[slot]];lines.push(`  ${slot} 的深度方向：${shift?shift.name+'。'+shift.prompt:'尚未選擇，請探索上升與下降的可能。'}`);}
    lines.push('');
  }
  lines.push(
    '【解牌與提案要求】',
    '1. 每個提案用一句話說明玩家在做什麼，以及最有意思的問題。',
    '2. 解釋 G、O、M 如何結合，以及各欄方向如何影響解讀；空牌保持該欄原意。',
    '3. 給出一段 30–60 秒的具體遊玩流程：起始局面 → 玩家操作 → 可見結果 → 下一個選擇。',
    '4. 列出可立即做灰盒的最小規則、2–3 個核心動詞與一個小場景。',
    '5. 指出一個需要實際試玩的問題，清楚區分設計推測與已觀察的事實。',
    '讓三個提案有不同的遊玩關係，不只更換故事包裝。'
  );
  return lines.join('\n');
}

  const raw=localStorage.getItem(KEY);
  if(raw===null)return seed();
  try{return validate(JSON.parse(raw));}catch(e){throw Error(`本機資料無法讀取，原始資料仍保留。${e.message}`);}
}
function save(state){
  const next=clone(state);next.revision++;
  const json=JSON.stringify(validate(next));
  try{localStorage.setItem(KEY,json);}catch{throw Error('裝置未允許儲存或空間不足。變更尚未儲存，請先匯出備份。');}
  return next;
}
function download(state){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`arcana-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
